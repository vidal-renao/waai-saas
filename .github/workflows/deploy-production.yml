name: Deploy to Vercel Production

on:
  push:
    branches:
      - release/staging-v0.9.0

env:
  VERCEL_ORG_ID: team_pq3l7uTjuKaC5k0zDjFoS6nz
  VERCEL_PROJECT_ID: prj_apWvqzaKjsfe7wNxOuEwoWuLidfP

jobs:
  # Quality gate — deploy is blocked unless type-check, lint and build pass.
  quality:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waai-saas
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: waai-saas/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production env)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
